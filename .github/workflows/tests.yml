name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-test.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q app.py allylight
  windows-exe:
    if: github.event_name == 'push'
    needs: unit
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-build.txt
      - run: python tools/build_windows.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AllyLight-0.3.0-windows-x64
          path: dist/package/
          if-no-files-found: error
          retention-days: 30
      - name: Upload build diagnostics after a failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-build-diagnostics
          path: |
            build/smoke/
            build/pyinstaller/AllyLight/warn-AllyLight.txt
          if-no-files-found: ignore
